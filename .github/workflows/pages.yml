name: Deploy playable demo to Pages

# 仓库只提交源码：可玩站点是构建产物（app/dist/ 被 .gitignore 忽略），
# 由本工作流在每次 push 到 main 时重新构建、自检，然后发布到 gh-pages 分支，
# 由 GitHub Pages 自己托管（Pages 站点 source = gh-pages 分支）。
#
# 为什么不用 actions/deploy-pages（artifact 通道）：2026-11-07 首次部署成功，
# 但之后连续三次在同一仓储的 artifact 部署都卡在 deployment 的 syncing_files
# 阶段直到 10 分钟超时（GitHub 状态页当时全绿，重建 Pages 站点也没恢复）。
# 换成 gh-pages 分支后 Pages 走分支构建链路，绕开这条卡死的同步通道。
#
# 发布地址：https://wangjunjian.com/moonlight-fighter/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 需要推送 gh-pages 分支

# 同一时刻只允许一个部署在跑，且不取消进行中的部署（避免站点短暂空档）。
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

      # 防「构建顺手改了源码」：构建必须只写 dist/（含被忽略的 .game-build-files.json），
      # 被跟踪文件一个都不许动，否则产物与提交的源码就对不上了。
      - name: Build must not touch tracked files
        run: test -z "$(git status --porcelain --untracked-files=no)"

      # 发布门禁：把 dist 挂到 Pages 的项目站点子路径下，用真实浏览器确认「不白屏」。
      # 单纯 curl 200 挡不住这个缺陷——basename 错了照样是 200 + 白屏。
      - run: npx playwright install --with-deps chromium
      - name: Pages sub-path render check
        run: npm run verify:pages

      # 完整游戏自检（对战流程、方向映射断言）。门禁是上一步；这一步暴露玩法回归，
      # 失败不阻断发布，但会在 run 里留下明确警告，避免「站点能开但玩不了」被漏掉。
      - name: Full gameplay self-check (non-blocking)
        continue-on-error: true
        run: npm run verify
      - name: Upload shots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-shots
          path: app/verification-shots/
          if-no-files-found: ignore

      - name: Assemble Pages site
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p site
          cp -R app/dist/. site/
          touch site/.nojekyll
          printf 'Build of commit %s\n' "$GITHUB_SHA" > site/build.txt
          printf 'User-agent: *\nDisallow:\n' > site/robots.txt

      # 只发布产物：gh-pages 分支上永远只有当前这一版，历史由 -f 覆盖，不会越滚越大。
      - name: Publish to gh-pages branch
        working-directory: ${{ github.workspace }}/site
        run: |
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
